spring:
  application:
    name: reg-log-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/reglog_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
    default-encoding: UTF-8

server:
  port: 8080
  servlet:
    context-path: /

# Application-specific configuration
app:
  jwt:
    secret: ${JWT_SECRET:}
    expiration-ms: ${JWT_EXPIRATION_MS:1800000}  # 30 minutes default
    issuer: ${JWT_ISSUER:reg-log-backend}
    cookie-name: ${AUTH_COOKIE_NAME:AUTH_TOKEN}
    cookie-secure: ${COOKIE_SECURE:true}

  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:5173,http://localhost:5174}

  mail:
    from: ${MAIL_FROM:noreply@example.com}

  otp:
    expiry-minutes: 5
    max-attempts: 5
    resend-cooldown-seconds: 60

  reset-token:
    expiry-minutes: 10

  rate-limit:
    login:
      capacity: 5
      refill-tokens: 5
      refill-seconds: 60
    forgot-password:
      capacity: 3
      refill-tokens: 3
      refill-seconds: 300

logging:
  level:
    com.auth.reglog: INFO
    org.springframework.security: DEBUG
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
